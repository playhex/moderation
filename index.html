<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayHex Moderation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .unread-separator { border-top: 2px solid #dc3545 !important; padding-top: 0.4rem; }
    @media (min-width: 992px) {
      #sidebar { width: 14rem; flex-shrink: 0; }
      #sidebar .offcanvas-body { position: sticky; top: 1rem; }
    }
    #sidebar .nav-link { padding: 0.3rem 0.75rem; border-radius: 0.375rem; }
    #sidebar .nav-link.active { background-color: var(--bs-secondary-bg); color: var(--bs-emphasis-color); }
  </style>
</head>
<body>
<nav class="navbar bg-body-tertiary mb-4">
  <div class="container-fluid">
    <div class="d-flex align-items-center gap-2">
      <button id="btn-sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none d-none" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">☰</button>
      <span class="navbar-brand fw-bold">PlayHex Moderation</span>
    </div>
    <div id="nav-controls"></div>
  </div>
</nav>
<div class="d-flex align-items-start px-lg-3">
  <aside id="sidebar" class="offcanvas-lg offcanvas-start" tabindex="-1" aria-label="Navigation">
    <div class="offcanvas-header">
      <span class="fw-bold">PlayHex Moderation</span>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-3 p-lg-0">
      <div id="nav-tabs" class="w-100"></div>
    </div>
  </aside>
  <main id="app" class="flex-grow-1 container-fluid px-4 pb-5" style="min-width: 0"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
